<!DOCTYPE html>
<html>
<head><title>Logging in...</title>
 <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080f08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BudgetTracker">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');
  const name   = params.get('name');
  const email  = params.get('email');
  if (token) {
    localStorage.setItem('token', token);
localStorage.setItem('userName', name);
localStorage.setItem('userEmail', email);

// ✅ Check if this user has seen onboarding before
const emailKey = email.toLowerCase().replace(/[^a-zA-Z0-9]/g, '_') + '_bt_onboarded';
const alreadyOnboarded = localStorage.getItem(emailKey);

// Also check generic onboarded flag (for Google login users)
const genericOnboarded = localStorage.getItem('bt_onboarded');

if (!alreadyOnboarded && !genericOnboarded) {
  sessionStorage.setItem('show_onboarding', '1');
  console.log('SET show_onboarding in auth-success');
}

window.location.href = 'index.html';
  } else {
    window.location.href = 'login.html';
  }
</script>
<!-- PWA Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
</html>
